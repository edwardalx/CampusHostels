version: "3.9"

services:
  db:
    image: postgres:15
    container_name: campushostels_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campushostels_user
      POSTGRES_PASSWORD: Kwakubonsu
      POSTGRES_DB: campushostels
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data:
