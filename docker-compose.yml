services:
  db:
    image: postgres:15
    container_name: campushostels_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - campushostels_net
    restart: always

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql_express
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - campushostels_net
    restart: always

  frontend:
    build:
      context: ./frontend/campushostel-fe
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://backend-api:8000
    container_name: campushostels_frontend
    env_file:
      - .env
    volumes:
      - frontend-static:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - web
  
  web:
    build:
      context: ./backend-admin
    container_name: campushostels_web
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: backend_admin.settings
      DATABASE_HOST: db
      DATABASE_PORT: ${DB_PORT}
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend-admin:/app
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --access-logfile - --workers 3 --bind 0.0.0.0:8000 backend_admin.wsgi:application"
    networks:
      - campushostels_net

  backend_api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: campushostels_backend_api
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ASPNETCORE_ENVIRONMENT: "Production"
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:5000"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - campushostels_net
    restart: always

  app1:
    build:
      context: /var/www/book-shelf-be
    container_name: app1_dotnet
    restart: always
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=BookShelf;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=false"
    ports:
      - "6001:6001"
    depends_on:
      - mssql
    networks:
      - campushostels_net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer-data:/data
    ports:
      - "9000:9000"
    networks:
      - campushostels_net
  nginx:
    image: nginx:1.25-alpine
    container_name: campushostels_nginx
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend-admin/staticfiles:/app/staticfiles:ro
      - ./backend-admin/media:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/book-shelf-fe:/var/www/book-shelf-fe:ro
      - frontend-static:/var/www/campushostels-fe:ro  # ← CHANGE THIS LINE
    depends_on:
      - web
      - app1
      - frontend  # ← ADD THIS
      - portainer  # ← ADD PORTAINER HERE
    networks:
      - campushostels_net
    restart: always

volumes:
  postgres_data:
  mssql_data:
  frontend-static:

networks:
  campushostels_net:
    driver: bridge