services:
  db:
    image: postgres:15
    container_name: campushostels_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - campushostels_net

  # -------------------------------------------------------
  # MSSQL Express for the .NET App
  # -------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql_express
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - campushostels_net
    restart: always

  web:
    build:
      context: ./backend-admin
    container_name: campushostels_web
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: backend_admin.settings
      DEBUG: "False"
      DATABASE_HOST: db
      DATABASE_PORT: ${DB_PORT}
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend-admin:/app
    depends_on:
      - db
    command: >
      gunicorn --access-logfile - --workers 3 --bind 0.0.0.0:8000 backend_admin.wsgi:application
    networks:
      - campushostels_net
  backend_api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: campushostels_backend_api
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - campushostels_net
    restart: always
  app1:
    build:
      context: /var/www/book-shelf-be
    container_name: app1_dotnet
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=BookShelf;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "6001:6001"
    depends_on:
      - mssql
    networks:
      - campushostels_net

  nginx:
    image: nginx:1.25-alpine
    container_name: campushostels_nginx
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend-admin/staticfiles:/app/staticfiles:ro
      - ./backend-admin/media:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/book-shelf-fe:/var/www/book-shelf-fe:ro
    depends_on:
      - web
      - app1
    networks:
      - campushostels_net
    restart: always

volumes:
  postgres_data:
  mssql_data:


networks:
  campushostels_net:
    driver: bridge
