# HTTP redirect to HTTPS
server {
    listen 80;
    server_name images.campushostels.duckdns.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name images.campushostels.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/campushostels.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campushostels.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://172.22.0.2:80;   # <- updated to container IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
