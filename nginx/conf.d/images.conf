# images.conf - Updated for HTTPS
server {
    listen 80;
    server_name images.campushostels.duckdns.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name images.campushostels.duckdns.org;

    # Use the same SSL certificate as main domain
    ssl_certificate /etc/letsencrypt/live/campushostels.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campushostels.duckdns.org/privkey.pem;

    # SSL configuration (copy from your main config)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://image-server:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache headers for images
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}