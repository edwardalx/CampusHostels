# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name bookshelfgh.duckdns.org;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;  # http2 enabled on 443
    server_name bookshelfgh.duckdns.org;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/bookshelfgh.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookshelfgh.duckdns.org/privkey.pem;

    # React frontend
    root /var/www/book-shelf-fe;
    index index.html;
        # Serve static assets directly
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # MIME types
        location ~* \.js$ {
            add_header Content-Type application/javascript;
        }
        location ~* \.css$ {
            add_header Content-Type text/css;
        }
        location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Serve other static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router - only for non-asset paths
    location / {
        try_files $uri /index.html;
    }

    # .NET API
        # .NET API
    location /api/ {
        proxy_pass http://bookshelf_app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI - ADD THIS BLOCK
    location /swagger/ {
        proxy_pass http://bookshelf_app/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router - only for non-asset paths
    location / {
        try_files $uri /index.html;
    }
}

