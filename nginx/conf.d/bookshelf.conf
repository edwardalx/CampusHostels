# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name bookshelfgh.duckdns.org;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;  # http2 enabled on 443
    server_name bookshelfgh.duckdns.org;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/bookshelfgh.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookshelfgh.duckdns.org/privkey.pem;

    # React frontend
    root /var/www/book-shelf-fe;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # .NET API
    location /api/ {
        proxy_pass http://app1_dotnet:6001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI
    location /swagger/ {
        proxy_pass http://app1_dotnet:6001/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

