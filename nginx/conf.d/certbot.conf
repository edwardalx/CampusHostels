server {
    listen 80;
    server_name campushostels.duckdns.org
                bookshelfgh.duckdns.org
                cockpit.bookshelfgh.duckdns.org;

    # Let's Encrypt / Certbot - MUST come before the redirect
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}