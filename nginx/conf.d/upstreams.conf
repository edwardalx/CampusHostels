# Use DOCKER SERVICE NAMES (from docker-compose.yml), not container names
upstream django_app {
    server web:8000;  # ✅ web is the service name in docker-compose
}

upstream bookshelf_app {
    server app1:6001;  # ✅ app1 is the service name (not app1_dotnet)
}

upstream backend_api {
    server backend_api:5000;  # ✅ backend_api is the service name
}