server {
    listen 80;
    server_name campushostels.duckdns.org;
    resolver 127.0.0.11 valid=30s;

    set $backend_upstream http://campushostels_backend_api:5000;
    set $image_upstream http://campushostels_image_server:80;
    set $frontend_upstream http://frontend:80;
    set $django_upstream http://campushostels_web:8000;
    set $legacy_image_upstream http://legacy-image-server:80;

    # ssl_certificate /etc/letsencrypt/live/campushostels.duckdns.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/campushostels.duckdns.org/privkey.pem;
    # Block dotfiles and common scan targets
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Return 404 (not SPA shell) for obvious probes
    location ~ ^/(v2|ecp|___proxy) {
        return 404;
    }
    # Static files
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # Backend API (CampusHostels API - app2)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (CampusHostels API)
    location /swagger/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Secure upload and public image access through this HTTPS host.
    location ^~ /image-service/ {
        rewrite ^/image-service/(.*)$ /$1 break;
        proxy_pass $image_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
        # Let's Encrypt / Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Manager dashboard SPA
    location = /manager {
        return 301 /manager/;
    }
    location ^~ /manager/ {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

     # Vite React frontend
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django backend inside Docker
    location /admin/ {
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix Django 403 on admin login
        proxy_set_header X-Forwarded-Host $host;
    }

    # Portainer is deliberately NOT routed through nginx. It controls the Docker daemon, so it must not be
    # reachable from the internet. Use an SSH tunnel instead:
    #   ssh -L 9000:127.0.0.1:9000 <user>@<server>   then open http://localhost:9000


        # Jenkins - simple version
    location /jenkins {
        return 302 $scheme://$host$request_uri/;
    }

    # location /images/ {
    #     proxy_pass http://image-server:80;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     # Optional: cache images in browser
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
       location /image-files/ {
        # "image-server" is ambiguous on the shared docker network (a second,
        # unrelated container used to share that exact name/alias too, which
        # caused non-deterministic routing). It's been renamed to
        # "legacy-image-server" to disambiguate; if that container is ever
        # recreated, make sure it's started with --name legacy-image-server.
        rewrite ^/image-files/(.*)$ /$1 break;
        proxy_pass $legacy_image_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
}