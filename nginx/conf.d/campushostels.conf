server {
    listen 80;
    server_name campushostels.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name campushostels.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/campushostels.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campushostels.duckdns.org/privkey.pem;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # Backend API (CampusHostels API - app2)
    location /api/ {
        proxy_pass http://campushostels_backend_api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (CampusHostels API)
    location /swagger/ {
        proxy_pass http://campushostels_backend_api:5000/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

     # Vite React frontend
    location / {
        root /var/www/campushostels-fe; 
        index index.html;
        try_files $uri $uri/ /index.html;  # ← Added $uri/
    }

    # Django backend inside Docker
    location /admin/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix Django 403 on admin login
        proxy_set_header X-Forwarded-Host $host;
    }

    # location /images/ {
    #     proxy_pass http://192.168.0.72:8082/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     # Optional: cache images in browser
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}