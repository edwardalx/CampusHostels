server {
    listen 443 ssl http2;
    server_name jenkins.campushostels.duckdns.org;

    # Use your existing SSL certificates
    ssl_certificate /etc/letsencrypt/live/campushostels.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campushostels.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://192.168.0.72:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Jenkins web interface
        proxy_redirect http:// https://;

        # Timeouts
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;

        # Don't buffer
        proxy_buffering off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name jenkins.campushostels.duckdns.org;
    return 301 https://$host$request_uri;
}