server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The service worker must never be cached, or browsers keep running an outdated one.
    location = /manager/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /manager/ {
        try_files $uri $uri/ /manager/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}